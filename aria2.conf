# Baked-in defaults. Copied to /config/aria2.conf on first run.
dir=/downloads
continue=true
file-allocation=falloc
log=/config/aria2.log

# --- Connection Speed & Multi-Source Optimization ---
max-concurrent-downloads=5
max-connection-per-server=16
min-split-size=10M
split=16
disable-ipv6=false

# RPC — secret is replaced at first start
enable-rpc=true
rpc-listen-all=true
rpc-allow-origin=true
rpc-listen-port=6800
rpc-secret=__RPC_SECRET__

# BitTorrent
bt-max-peers=128
listen-port=6888
dht-listen-port=6888
enable-dht=true
enable-peer-exchange=true

# Session persistence
save-session=/config/aria2.session
input-file=/config/aria2.session
save-session-interval=60